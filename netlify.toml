# Netlify settings for Tommy Stories.
# No build step: Netlify publishes the plain HTML at the top of the repo as-is.

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "22"

# Functions: confirmation emails for stories and letters, Share with a friend
# (submission-created, friend-reminders, friend-stop) and Facebook posts
# (facebook-poster). See the README.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The Facebook posting robot reads the approved posts and their images from
# social/posts/ (they aren't served on the public site; see _redirects).
[functions."facebook-poster"]
  included_files = ["social/posts/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fonts never change once published, so browsers can keep them for a year.
# Everything else (styles, scripts, images) uses Netlify's default: browsers
# check for a newer copy on each visit, so changes show up right away.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
