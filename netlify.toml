# Netlify settings for Tommy Stories.
# No build step: Netlify publishes the plain HTML at the top of the repo as-is.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fonts never change once published, so browsers can keep them for a year.
# Everything else (styles, scripts, images) uses Netlify's default: browsers
# check for a newer copy on each visit, so changes show up right away.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
